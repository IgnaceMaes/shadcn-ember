<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      // Apply the theme before first paint; prerendered HTML can't know it.
      // Must stay in sync with app/services/theme.ts.
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      })();
    </script>
    <title>The Foundation for your Design System - shadcn-ember</title>
    <meta name="description" content="A set of beautifully designed components that you can customize, extend, and build on. Start here then make it your own. Open Source. Open Code.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:image" content="/opengraph-image.png">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- VITE_EMBER_SSR_HEAD -->
  </head>
  <body class="group/body overscroll-none antialiased [--footer-height:calc(var(--spacing)*14)] [--header-height:calc(var(--spacing)*14)] xl:[--footer-height:calc(var(--spacing)*24)]">
    <!-- VITE_EMBER_SSR_BODY -->

    <script type="module" src="/app/entry.ts"></script>
  </body>
</html>
